<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Foundry Laundry — Login</title>
    <link rel="stylesheet" href="styles.css"/>
    <style>
        body {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: var(--bg);
        }

        .login-wrap {
          width: 100%;
          max-width: 420px;
          padding: 20px;
        }

        .login-logo {
          font-family: 'Syne', sans-serif;
          font-size: 32px;
          font-weight: 800;
          color: var(--accent);
          text-align: center;
          margin-bottom: 4px;
        }
        .login-logo span { color: var(--text); }

        .login-sub {
          text-align: center;
          font-size: 12px;
          color: var(--muted);
          letter-spacing: 2px;
          text-transform: uppercase;
          margin-bottom: 40px;
        }

        .login-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 36px;
        }

        .login-title {
          font-family: 'Syne', sans-serif;
          font-size: 20px;
          font-weight: 700;
          margin-bottom: 24px;
        }

        .form-group {
          display: flex;
          flex-direction: column;
          gap: 8px;
          margin-bottom: 16px;
        }

        label {
          font-size: 12px;
          color: var(--muted);
          text-transform: uppercase;
          letter-spacing: 1px;
        }

        input {
          background: var(--bg);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 12px 16px;
          color: var(--text);
          font-family: 'DM Sans', sans-serif;
          font-size: 14px;
          outline: none;
          transition: border-color .2s;
          width: 100%;
        }
        input:focus { border-color: var(--accent); }

        .btn-login {
          width: 100%;
          padding: 14px;
          background: var(--accent);
          color: #0f0f0f;
          border: none;
          border-radius: 8px;
          font-family: 'DM Sans', sans-serif;
          font-size: 15px;
          font-weight: 600;
          cursor: pointer;
          margin-top: 8px;
          transition: opacity .2s, transform .2s;
        }
        .btn-login:hover { opacity: .85; transform: translateY(-1px); }

        .error-msg {
          background: rgba(245,78,78,.1);
          border: 1px solid var(--danger);
          border-radius: 8px;
          padding: 12px 16px;
          color: var(--danger);
          font-size: 13px;
          margin-bottom: 16px;
          display: none;
        }
        .error-msg.show { display: block; }

        .login-footer {
          text-align: center;
          margin-top: 24px;
          font-size: 12px;
          color: var(--muted);
        }
    </style>
</head>
<body>

<div class="login-wrap">
    <div class="login-logo">FOUNDRY<span>.</span></div>
    <div class="login-sub">Laundry Management System</div>

    <div class="login-card">
        <div class="login-title">Masuk ke Sistem</div>

        <div class="error-msg" id="error-msg">Username atau password salah.</div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Masukkan username" autocomplete="off"/>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Masukkan password"/>
        </div>

        <button class="btn-login" onclick="login()" id="btn-login">Masuk</button>
    </div>

    <div class="login-footer">Foundry</div>
</div>

<script>
    const API = 'http://localhost:8080/api';

    // Kalau sudah login, langsung ke dashboard
    if (localStorage.getItem('foundry_token')) {
      window.location.href = 'index.html';
    }

    // Login dengan tekan Enter
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errMsg   = document.getElementById('error-msg');
      const btn      = document.getElementById('btn-login');

      if (!username || !password) {
        errMsg.textContent = 'Username dan password wajib diisi.';
        errMsg.classList.add('show');
        return;
      }

      btn.textContent = 'Memproses...';
      btn.disabled    = true;

      try {
        const res = await fetch(API + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        }).then(r => r.json());

        if (res.sukses) {
          // Simpan token di localStorage
          localStorage.setItem('foundry_token', res.token);
          // Redirect ke dashboard
          window.location.href = 'index.html';
        } else {
          errMsg.textContent = res.pesan;
          errMsg.classList.add('show');
          btn.textContent = 'Masuk';
          btn.disabled    = false;
        }

      } catch (e) {
        errMsg.textContent = 'Gagal terhubung ke server. Pastikan server Java sudah dijalankan.';
        errMsg.classList.add('show');
        btn.textContent = 'Masuk';
        btn.disabled    = false;
      }
    }
</script>
</body>
</html>
